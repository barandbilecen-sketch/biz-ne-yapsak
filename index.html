<head>

<title>Biz Ne Yapsak?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: tek sütun telefon uygulaması, yapışkan başlık + alt sekme çubuğu; kartlar fikir "biletleri" gibi */
:root{
  --bg:#FBF2F5; --surface:#FFFFFF; --sunk:#F4E6EC; --ink:#2B1630; --muted:#7A5F80; --line:#EAD5DE;
  --cherry:#E2365B; --cherry-ink:#FFFFFF; --cherry-soft:#FCDDE4;
  --mint:#21907A; --mint-soft:#D8F2EA; --butter:#F6B93B; --butter-soft:#FDF0D2;
  --plum:#5B3A7A;
  --display:"Caprasimo","Cooper Black",Georgia,serif;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1120; --surface:#251A2C; --sunk:#2F2237; --ink:#F7E8F0; --muted:#B89FBF; --line:#3D2D46;
  --cherry:#FF5C80; --cherry-ink:#2A0B14; --cherry-soft:#4A1E2E;
  --mint:#4FD1B1; --mint-soft:#183A33; --butter:#FFC95C; --butter-soft:#3E3018; --plum:#C9A5EE;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1120; --surface:#251A2C; --sunk:#2F2237; --ink:#F7E8F0; --muted:#B89FBF; --line:#3D2D46;
  --cherry:#FF5C80; --cherry-ink:#2A0B14; --cherry-soft:#4A1E2E;
  --mint:#4FD1B1; --mint-soft:#183A33; --butter:#FFC95C; --butter-soft:#3E3018; --plum:#C9A5EE;
  color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
button.duo{background:none;border:0;padding:0;cursor:pointer}
.code{font-family:ui-monospace,Menlo,monospace;font-size:26px;letter-spacing:.18em;font-weight:800;text-align:center;background:var(--sunk);border-radius:14px;padding:14px;user-select:all}
.or{text-align:center;color:var(--muted);font-size:13px;font-weight:700}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--cherry);outline-offset:2px;border-radius:10px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1;margin:0;letter-spacing:.2px;color:var(--cherry)}
h1 small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.duo{display:flex;align-items:center}
.duo img{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--bg);object-fit:cover;background:var(--sunk)}
.duo img+img{margin-left:-10px}
.duo .heart{margin:0 -4px;z-index:2;color:var(--cherry);font-size:15px;position:relative}
.duo .ghost{width:32px;height:32px;border-radius:50%;border:2px dashed var(--muted);display:grid;place-items:center;color:var(--muted);font-size:16px;margin-left:-6px;background:var(--bg)}

.cities{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none;margin:0 -2px}
.cities::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sm{padding:5px 11px;font-size:13px}

main section{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}

.next{display:flex;gap:14px;align-items:center;background:var(--cherry);color:var(--cherry-ink);border-radius:var(--r);padding:14px 16px}
.next .big{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.next .big small{display:block;font-family:var(--body);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.next b{display:block;font-size:16px}
.next span{font-size:13px;opacity:.88}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.cherry{background:var(--cherry);color:var(--cherry-ink)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13.5px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.count{font-size:13px;color:var(--muted);font-weight:600}

.card{background:var(--surface);border-radius:var(--r);padding:16px 16px 12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;position:relative}
.card.match{border-color:var(--mint);box-shadow:0 0 0 2px var(--mint-soft)}
.card .kicker{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.cat{display:inline-flex;align-items:center;gap:6px}
.cat i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--c)}
.card h3{margin:0;font-size:19px;line-height:1.2;font-weight:800;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;font-weight:600;background:var(--sunk);padding:3px 9px;border-radius:999px;color:var(--ink)}
.tag.time{background:var(--mint-soft);color:var(--mint)}
.tag.nofit{background:transparent;border:1px solid var(--line);color:var(--muted)}
.timebox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tb-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tb-head b{font-size:15px}
.tb-sel{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.tb-sel.off{opacity:.45}
.tb-dash{padding-bottom:12px;color:var(--muted);font-weight:800}
.tag.where{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.perf{border-top:1.5px dashed var(--line);margin:2px -16px 0;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-8px;clip-path:inset(0 0 0 50%)}
.perf::after{right:-8px;clip-path:inset(0 50% 0 0)}
.votes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vote{border:1.5px solid var(--line);background:transparent;border-radius:11px;padding:6px 10px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:5px;min-height:36px}
.vote[aria-pressed="true"][data-v="love"]{background:var(--cherry);border-color:var(--cherry);color:var(--cherry-ink)}
.vote[aria-pressed="true"][data-v="maybe"]{background:var(--butter);border-color:var(--butter);color:#2B1630}
.vote[aria-pressed="true"][data-v="no"]{background:var(--sunk);border-color:var(--muted)}
.votes .sp{flex:1}
.theirs{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.theirs img{width:20px;height:20px;border-radius:50%}
.badge-match{background:var(--mint);color:var(--surface);font-size:11px;padding:3px 8px;border-radius:999px;letter-spacing:.06em}

.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1.5px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:6px 0 0;line-height:1.1}
.sub{color:var(--muted);margin:-6px 0 0;font-size:14px}

.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:64px 1fr;overflow:hidden}
.plan .date{background:var(--cherry-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;text-align:center}
.plan .date .d{font-family:var(--display);font-size:28px;line-height:1;color:var(--cherry);font-variant-numeric:tabular-nums}
.plan .date .m{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--cherry)}
.plan .date .w{font-size:11px;color:var(--muted);margin-top:2px}
.plan.past .date{background:var(--sunk)}
.plan.past .date .d,.plan.past .date .m{color:var(--muted)}
.plan .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.plan h4{margin:0;font-size:16.5px;line-height:1.25}
.plan .info{font-size:13px;color:var(--muted)}
.plan .note{font-size:14px;background:var(--butter-soft);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}
.cal{display:flex;gap:6px;flex-wrap:wrap}
.cal a{font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px}
.stars{display:flex;gap:2px}
.stars button{background:none;border:0;font-size:22px;padding:0 2px;color:var(--line);line-height:1}
.stars button.on{color:var(--butter)}
.memo{font-size:14px;font-style:italic;color:var(--ink);overflow-wrap:anywhere}
.when-pill{font-size:12px;font-weight:800;color:var(--mint);background:var(--mint-soft);padding:2px 8px;border-radius:999px;align-self:flex-start}

.notes{columns:2 160px;column-gap:10px}
.note-card{break-inside:avoid;margin-bottom:10px;border-radius:14px;padding:14px 14px 10px;background:var(--c);color:#2B1630;transform:rotate(var(--rot));position:relative}
.note-card p{margin:0 0 8px;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.note-card .by{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;opacity:.75}
.note-card .x{background:none;border:0;font-size:16px;color:#2B1630;opacity:.6;padding:0 2px}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--sunk);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cherry);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--cherry)}
nav.tabs .dot{position:absolute;top:4px;left:calc(50% + 8px);background:var(--mint);color:var(--surface);font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums}

.sheet-bg{position:fixed;inset:0;background:rgba(20,8,24,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto;animation:up .22s ease-out}
.sheet h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.1}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-top:-6px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

.wheel{background:var(--cherry);color:var(--cherry-ink);border-radius:var(--r);padding:26px 18px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.wheel .t{font-family:var(--display);font-size:26px;line-height:1.15;text-wrap:balance}
.wheel .c{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.wheel.spin .t{animation:flick .09s linear infinite}
@keyframes flick{50%{opacity:.55}}

.banner{font-size:13.5px;background:var(--butter-soft);border-radius:14px;padding:10px 12px;color:var(--ink)}
.banner b{font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 8px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.wheel.spin .t{animation:none}}
@media (max-width:380px){.grid2{grid-template-columns:1fr}.card h3{font-size:18px}}
</style>

</div></nav>

const people={}; // id -> {name,avatarUrl}

/* ---- local fallback ---- */
function loadLocal(){try{const d=JSON.parse(localStorage.getItem("bny-data")||"null");if(d)Object.assign(S,d)}catch(e){}}
function saveLocal(){if(shared)return;try{localStorage.setItem("bny-data",JSON.stringify(S))}catch(e){}}

/* ------------------ YAZMA İŞLEMLERİ ------------------ */
function denied(e){
  if(e&&e.code==="permission-denied"){toast("Kaydedilemedi: Firestore kuralları izin vermiyor.");return}
  if(e&&e.code==="invalid_argument"){readOnly=true;toast("Bu sayfada değişiklik iznin yok. Sahibinden seni Düzenleyici olarak eklemesini iste.");render()}
  else if(e&&e.code==="quota_exceeded")toast("Depolama doldu, eski notları silmeyi dene.");
  else toast("Kaydedilemedi, birazdan tekrar dene.");
}
async function setVote(idea,v){
  if(readOnly)return toast("Sadece görüntüleme izni var.");
  const key=idea+"~"+myId,cur=S.votes[key];
  const nv=cur&&cur.v===v?null:v;
  if(nv)S.votes[key]={uid:myId,idea,v:nv,ts:Date.now()};else delete S.votes[key];
  render();
  if(shared){try{const r=db.collection("votes").doc(key);nv?await r.set(S.votes[key]):await r.delete()}catch(e){denied(e)}}else saveLocal();
  if(nv==="love"){const pv=partnerVote(idea);if(pv==="love")toast("Eşleşme! İkiniz de bayıldınız 💞")}
}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
async function addDoc(col,data){
  if(readOnly)return toast("Sadece görüntüleme izni var.");
  const id=newId();data={...data,by:myId,ts:Date.now()};
  S[col].push({id,...data});render();
  if(shared){try{await db.collection(col).doc(id).set(data)}catch(e){S[col]=S[col].filter(x=>x.id!==id);denied(e)}}else saveLocal();
  return id;
}
async function patchDoc(col,id,patch){
  if(readOnly)return toast("Sadece görüntüleme izni var.");
  const it=S[col].find(x=>x.id===id);if(!it)return;Object.assign(it,patch);render();
  if(shared){try{await db.collection(col).doc(id).update(patch)}catch(e){denied(e)}}else saveLocal();
}
async function delDoc(col,id){
  if(readOnly)return toast("Sadece görüntüleme izni var.");
  S[col]=S[col].filter(x=>x.id!==id);render();
  if(shared){try{await db.collection(col).doc(id).delete()}catch(e){denied(e)}}else saveLocal();
}

/* ------------------ YARDIMCI ------------------ */
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function allIdeas(){return BASE.concat(S.ideas.map(x=>({id:"c-"+x.id,t:x.t,d:x.d||"",cat:x.cat||"romantik",b:+x.b||1,w:x.w||"h",p:x.p||"",city:x.city||"*",custom:true,by:x.by,docId:x.id})))}
function ideaById(id){return allIdeas().find(x=>x.id===id)}
function myVote(id){return S.votes[id+"~"+myId]?.v||null}
function partnerId(){
  const ids=new Set();Object.values(S.votes).forEach(v=>ids.add(v.uid));S.plans.forEach(p=>ids.add(p.by));S.notes.forEach(n=>ids.add(n.by));S.ideas.forEach(n=>ids.add(n.by));
  members.forEach(m=>ids.add(m));ids.delete(myId);ids.delete(undefined);return [...ids][0]||null;
}
function partnerVote(id){const p=partnerId();return p?S.votes[id+"~"+p]?.v||null:null}
function pname(id){if(id===myId)return "Sen";return (people[id]&&people[id].name)?people[id].name.split(" ")[0]:"Sevgilin"}
function pav(id){return people[id]?.avatarUrl||""}
async function resolvePeople(){return;
  if(!user)return;const ids=[myId,partnerId()].filter(Boolean);
  try{const ps=await user.profiles(ids);let ch=false;for(const id of ids){const p=ps[id];if(!p)continue;const o=people[id];if(!o||o.name!==p.name||o.avatarUrl!==p.avatarUrl){people[id]={name:p.name,avatarUrl:p.avatarUrl};ch=true}}if(ch)render(true)}catch(e){}
}
const BUD=["","₺","₺₺","₺₺₺"],WHEN={g:"Gündüz",a:"Akşam",h:"Her saat"};
const AY=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"],GUN=["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function pdate(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function daysTo(s){return Math.round((pdate(s)-today())/864e5)}
function rel(n){return n===0?"Bugün":n===1?"Yarın":n>1?n+" gün kaldı":Math.abs(n)+" gün önce"}
function toast(msg){const r=$("#toastRoot");r.innerHTML='<div class="toast" role="status"></div>';r.firstChild.textContent=msg;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",2800)}

function calLinks(p){
  const [h,mi]=(p.time||"19:00").split(":").map(Number);const st=pdate(p.date);st.setHours(h,mi);const en=new Date(st.getTime()+(+p.dur||3)*36e5);
  const f=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"T"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"00";
  const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":00";
  const text="💞 Date: "+p.title,det=(p.note?p.note+"\n\n":"")+"Biz Ne Yapsak? ile planlandı",loc=[p.place,p.city!=="*"?p.city:""].filter(Boolean).join(", ");
  const g="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(text)+"&dates="+f(st)+"/"+f(en)+"&ctz=Europe/Istanbul&details="+encodeURIComponent(det)+"&location="+encodeURIComponent(loc);
  const o="https://outlook.live.com/calendar/0/deeplink/compose?path=/calendar/action/compose&rru=addevent&subject="+encodeURIComponent(text)+"&startdt="+iso(st)+"&enddt="+iso(en)+"&body="+encodeURIComponent(det)+"&location="+encodeURIComponent(loc);
  return {g,o};
}

function render(skipPeople){
  $("#cityLabel").textContent=ui.city+"'da date fikirleri";
  // duo
  const pid=partnerId();
  const duo=$("#duo");duo.innerHTML="";
  const im=(id)=>{const i=document.createElement("img");i.alt=pname(id);i.src=pav(id)||"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" fill="#E2365B"/><text x="16" y="21" font-size="14" text-anchor="middle" fill="#fff" font-family="sans-serif">'+esc((pname(id)==="Sen"?(people[id]?.name||"S"):pname(id)).charAt(0).toUpperCase())+'</text></svg>');return i};
  duo.appendChild(im(myId));const h=document.createElement("span");h.className="heart";h.textContent="♥";duo.appendChild(h);
  if(pid)duo.appendChild(im(pid));else{const g=document.createElement("span");g.className="ghost";g.title="Sevgilin henüz katılmadı";g.textContent="?";duo.appendChild(g)}
  // cities
  $("#cities").innerHTML=CITIES.map(c=>`<button class="chip" aria-pressed="${c===ui.city}" data-city="${esc(c)}">${esc(c)}</button>`).join("");
  // tabs
  document.querySelectorAll("nav.tabs button").forEach(b=>b.toggleAttribute("aria-current",false)||b.dataset.tab===ui.tab&&b.setAttribute("aria-current","page"));

  const mc=matches().length;const dot=$("#matchDot");dot.hidden=!mc;dot.textContent=mc;
  if(ui.tab==="kesfet")renderKesfet();
  if(ui.tab==="eslesme")renderEslesme();
  if(ui.tab==="planlar")renderPlanlar();
  if(ui.tab==="notlar")renderNotlar();
  if(!skipPeople)resolvePeople();
}

function filtered(){
  return cityIdeas().filter(i=>(ui.cat==="all"||i.cat===ui.cat)&&(!ui.budget||i.b<=ui.budget)&&(ui.anyTime||fits(i))
    &&(ui.show==="all"?myVote(i.id)!=="no":ui.show==="new"?!myVote(i.id):ui.show==="partner"?partnerVote(i.id)==="love":myVote(i.id)==="no"));
}
function nextPlan(){return S.plans.filter(p=>!p.done&&daysTo(p.date)>=0).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0]}

function banners(){
  let h="";
  if(!FIREBASE_CONFIG)h+=`<div class="banner"><b>Şu an sadece bu cihazda kaydediliyor.</b> Ortak kullanım için index.html içine Firebase ayarını eklemek gerekiyor.</div>`;

  return `<article class="card ${isMatch?"match":""}">
    <div class="kicker"><span class="cat" style="--c:${c.c}"><i></i>${c.n}</span>${isMatch?'<span class="badge-match">EŞLEŞME</span>':i.custom?'<span class="tag">Sizin fikriniz</span>':""}</div>

const PRESETS=[[12,19,"Bizim saat 12–19"],[12,16,"Öğle 12–16"],[15,19,"İkindi 15–19"],[9,23,"Tüm gün"]];
function hourOpts(a,b,sel){let h="";for(let x=a;x<=b;x++)h+=`<option value="${x}" ${x===sel?"selected":""}>${hh(x)}${x>=24?" (gece)":""}</option>`;return h}
function timeTag(i){
  const [s,e,d]=timing(i);
  if(ui.anyTime)return `<span class="tag">${hh(s)}–${hh(e)} · ~${durTxt(d)}</span>`;
  if(fits(i))return `<span class="tag time">Başlangıç ${hh(startFor(i))} · ~${durTxt(d)}</span>`;
  return `<span class="tag nofit">Saatinize uymuyor · ${hh(s)}–${hh(e)}</span>`;
}

    <div class="date"><span class="d">${d.getDate()}</span><span class="m">${AY[d.getMonth()]}</span><span class="w">${GUN[d.getDay()]} ${esc(p.time||"")}</span></div>

      ${p.note?`<div class="note">${esc(p.note)}</div>`:""}

/* ------------------ SAYFALAR (SHEET) ------------------ */
let sheetLocked=false;
function sheet(html,onMount,lock){
  sheetLocked=!!lock;const r=$("#sheetRoot");r.innerHTML=`<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  r.firstChild.addEventListener("click",e=>{if(e.target===r.firstChild&&!sheetLocked)closeSheet()});
  onMount&&onMount(r.querySelector(".sheet"));
  const f=r.querySelector("input,textarea,select,button");f&&f.focus();
}
function closeSheet(){$("#sheetRoot").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheetLocked)closeSheet()});

function planSheet(ideaId,editId){
  const ed=editId?S.plans.find(p=>p.id===editId):null;
  const i=ed?null:ideaId!=="__free"?ideaById(ideaId):null;
  const d=new Date();d.setDate(d.getDate()+((6-d.getDay()+7)%7||7));
  const def=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const t=ed?ed.title:i?i.t:"",place=ed?ed.place:i?i.p:"",time=ed?ed.time:i?hh(startFor(i)):hh(ui.anyTime?19:ui.from);
  const defDur=ed?+ed.dur:i?Math.min(8,Math.ceil(timing(i)[2])):3;
  sheet(`<h3>${ed?"Planı düzenle":"Date planla"}</h3>
    <div class="field"><label for="pTitle">Ne yapıyoruz?</label><input id="pTitle" maxlength="80" value="${esc(t)}" placeholder="Örn. Moda'da gün batımı"></div>
    <div class="grid2"><div class="field"><label for="pDate">Tarih</label><input id="pDate" type="date" value="${esc(ed?ed.date:def)}"></div>
    <div class="field"><label for="pTime">Saat</label><input id="pTime" type="time" value="${esc(time)}"></div></div>
    <div class="grid2"><div class="field"><label for="pPlace">Yer</label><input id="pPlace" maxlength="80" value="${esc(place||"")}" placeholder="Opsiyonel"></div>
    <div class="field"><label for="pDur">Süre</label><select id="pDur">${[1,2,3,4,5,6,7,8].map(h=>`<option value="${h}" ${defDur===h?"selected":""}>${h} saat</option>`).join("")}</select></div></div>
    <div class="field"><label for="pNote">Not (giyim, rezervasyon, sürpriz ipucu...)</label><textarea id="pNote" rows="2" maxlength="240">${esc(ed?ed.note:"")}</textarea></div>
    <div class="actions"><button class="btn line" id="pCancel">Vazgeç</button><button class="btn cherry" id="pSave">${ed?"Kaydet":"Takvime koy"}</button></div>`,s=>{
      s.querySelector("#pCancel").onclick=closeSheet;
      s.querySelector("#pSave").onclick=async()=>{
        const data={title:$("#pTitle").value.trim(),date:$("#pDate").value,time:$("#pTime").value,place:$("#pPlace").value.trim(),dur:+$("#pDur").value,note:$("#pNote").value.trim()};
        if(!data.title)return toast("Ne yapacağınızı yazın.");if(!data.date)return toast("Bir tarih seçin.");
        closeSheet();
        if(ed){await patchDoc("plans",ed.id,data);toast("Plan güncellendi.")}
        else{await addDoc("plans",{...data,idea:i?i.id:"",city:i?i.city:ui.city,done:false,rating:0,memory:""});if(!readOnly){toast("Planlandı! Takvim butonlarıyla telefonuna da ekle.");ui.tab="planlar";saveUI();render()}}
      };
    });
}
function memoSheet(id){
  const p=S.plans.find(x=>x.id===id);
  sheet(`<h3>Bu date nasıldı?</h3><div class="field"><label for="mIn">Bir cümlelik anı</label><textarea id="mIn" rows="3" maxlength="240" placeholder="En çok güldüğümüz an...">${esc(p.memory||"")}</textarea></div>
  <div class="actions"><button class="btn line" id="mC">Vazgeç</button><button class="btn cherry" id="mS">Kaydet</button></div>`,s=>{
    s.querySelector("#mC").onclick=closeSheet;s.querySelector("#mS").onclick=()=>{patchDoc("plans",id,{memory:$("#mIn").value.trim()});closeSheet()}});
}
function ideaSheet(){
  sheet(`<h3>Kendi fikrimiz</h3>
  <div class="field"><label for="iT">Fikir</label><input id="iT" maxlength="70" placeholder="Örn. Sabah 6'da Galata Köprüsü'nde balık ekmek"></div>
  <div class="field"><label for="iD">Kısa açıklama</label><textarea id="iD" rows="2" maxlength="200"></textarea></div>
  <div class="grid2"><div class="field"><label for="iC">Kategori</label><select id="iC">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join("")}</select></div>
  <div class="field"><label for="iB">Bütçe</label><select id="iB"><option value="1">₺</option><option value="2">₺₺</option><option value="3">₺₺₺</option></select></div></div>
  <div class="grid2"><div class="field"><label for="iW">Zaman</label><select id="iW"><option value="h">Her saat</option><option value="g">Gündüz</option><option value="a">Akşam</option></select></div>
  <div class="field"><label for="iCity">Şehir</label><select id="iCity">${CITIES.map(c=>`<option ${c===ui.city?"selected":""}>${esc(c)}</option>`).join("")}<option value="*">Her yerde</option></select></div></div>
  <div class="field"><label for="iP">Yer</label><input id="iP" maxlength="60" placeholder="Opsiyonel"></div>
  <div class="actions"><button class="btn line" id="iX">Vazgeç</button><button class="btn cherry" id="iS">Ekle</button></div>`,s=>{
    s.querySelector("#iX").onclick=closeSheet;
    s.querySelector("#iS").onclick=async()=>{const t=$("#iT").value.trim();if(!t)return toast("Fikre bir isim verin.");
      const data={t,d:$("#iD").value.trim(),cat:$("#iC").value,b:+$("#iB").value,w:$("#iW").value,city:$("#iCity").value,p:$("#iP").value.trim()};
      closeSheet();const id=await addDoc("ideas",data);if(id&&!readOnly){toast("Fikriniz eklendi, ilk kalbi de attık.");setVote("c-"+id,"love")}};
  });
}
function spinSheet(){
  let pool=filtered().filter(i=>myVote(i.id)!=="no");
  const loved=pool.filter(i=>myVote(i.id)==="love"||partnerVote(i.id)==="love");
  sheet(`<h3>Şansımıza bırakalım</h3>
  <div class="seg" role="group" aria-label="Havuz"><button data-pool="all" aria-pressed="true">Filtredeki tüm fikirler (${pool.length})</button><button data-pool="love" aria-pressed="false">Kalp atılanlar (${loved.length})</button></div>
  <div class="wheel" id="wheel"><div class="c" id="wc">hazır mısınız?</div><div class="t" id="wt">Çevir ve kader seçsin</div></div>
  <div class="actions"><button class="btn primary" id="wGo">Çevir</button><button class="btn cherry" id="wPlan" disabled>Bunu planla</button></div>
  <button class="btn line sm" id="wX">Kapat</button>`,s=>{
    let usePool=pool,picked=null;
    s.querySelectorAll("[data-pool]").forEach(b=>b.onclick=()=>{s.querySelectorAll("[data-pool]").forEach(x=>x.setAttribute("aria-pressed",x===b));usePool=b.dataset.pool==="love"?loved:pool});
    s.querySelector("#wX").onclick=closeSheet;
    s.querySelector("#wGo").onclick=()=>{
      if(!usePool.length)return toast("Bu havuzda fikir yok.");
      const w=s.querySelector("#wheel"),go=s.querySelector("#wGo");go.disabled=true;w.classList.add("spin");
      const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;let n=0,steps=reduce?1:18;
      const tick=()=>{const it=usePool[Math.floor(Math.random()*usePool.length)];s.querySelector("#wt").textContent=it.t;s.querySelector("#wc").textContent=(CATS[it.cat]||{}).n||"";picked=it;
        if(++n<steps)setTimeout(tick,50+n*12);else{w.classList.remove("spin");go.disabled=false;go.textContent="Tekrar çevir";s.querySelector("#wPlan").disabled=false}};
      tick();
    };
    s.querySelector("#wPlan").onclick=()=>{if(picked)planSheet(picked.id)};
  });
}

/* ------------------ OLAYLAR ------------------ */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.city){ui.city=t.dataset.city;ui.tab="kesfet";saveUI();render();scrollTo({top:0});return}
  if(t.dataset.tab){ui.tab=t.dataset.tab;saveUI();render();scrollTo({top:0});return}
  if(t.dataset.cat){ui.cat=t.dataset.cat;saveUI();render();return}
  if(t.dataset.bud!==undefined){ui.budget=+t.dataset.bud;saveUI();render();return}
  if(t.dataset.anytime){ui.anyTime=!ui.anyTime;saveUI();render();return}
  if(t.dataset.preset){const [a,b]=t.dataset.preset.split("-").map(Number);ui.from=a;ui.to=b;ui.anyTime=false;saveUI();render();return}
  if(t.dataset.show){ui.show=t.dataset.show;saveUI();render();return}
  if(t.dataset.vote){setVote(t.dataset.vote,t.dataset.v);return}
  if(t.dataset.plan){planSheet(t.dataset.plan);return}
  if(t.dataset.edit){planSheet(null,t.dataset.edit);return}
  if(t.dataset.done){patchDoc("plans",t.dataset.done,{done:true});toast("Harika! Şimdi yıldız verip anı yazın.");return}
  if(t.dataset.del){const id=t.dataset.del;if(t.dataset.sure){delDoc("plans",id)}else{t.dataset.sure="1";t.textContent="Emin misin?";setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent="Sil"}},3000)}return}
  if(t.dataset.rate){patchDoc("plans",t.dataset.rate,{rating:+t.dataset.s});return}
  if(t.dataset.memo){memoSheet(t.dataset.memo);return}
  if(t.dataset.delnote){delDoc("notes",t.dataset.delnote);return}
  if(t.dataset.room){roomSheet();return}
  if(t.id==="spinBtn"||t.id==="spinBtn2"){spinSheet();return}
  if(t.id==="addIdeaBtn"){ideaSheet();return}
  if(t.id==="noteBtn"){const v=$("#noteIn").value.trim();if(!v)return toast("Önce bir şey yaz.");addDoc("notes",{text:v});return}
});

document.addEventListener("change",e=>{
  const id=e.target.id;if(id!=="tFrom"&&id!=="tTo")return;
  let a=+$("#tFrom").value,b=+$("#tTo").value;
  if(b<=a){if(id==="tFrom")b=a+1;else a=b-1}
  ui.from=a;ui.to=b;saveUI();render();
  const el=$("#"+id);el&&el.focus();
});
/* ------------------ ODA (FIREBASE) ------------------ */
let fs=null,room=null,unsubs=[],members=[];
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function roomLink(){return location.origin+location.pathname+"#"+room}
function newCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";const r=crypto.getRandomValues(new Uint32Array(8));for(const x of r)c+=a[x%a.length];return c}
function cleanCode(v){return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,12)}

function onboard(){
  const fromHash=cleanCode(location.hash.slice(1));
  sheet(`<h3>${fromHash?"Seni bekleyen bir oda var":"Hoş geldiniz"}</h3>
  <p class="sub" style="margin:0">${fromHash?"Sevgilin seni davet etti. Adını yaz ve katıl.":"Adını yaz, sonra yeni bir oda kur ya da sevgilinden aldığın kodla katıl."}</p>
  <div class="field"><label for="obName">Adın</label><input id="obName" maxlength="24" value="${esc(lsGet("bny-name")||"")}" placeholder="Örn. Doğukan"></div>
  ${fromHash?`<div class="code">${fromHash}</div><button class="btn cherry" id="obJoin">Odaya katıl</button>`
  :`<button class="btn cherry" id="obNew">Yeni oda kur</button><div class="or">ya da</div>
   <div class="field"><label for="obCode">Oda kodu</label><input id="obCode" maxlength="12" placeholder="Sevgilinin gönderdiği kod" autocapitalize="characters"></div>
   <button class="btn primary" id="obJoin">Koda katıl</button>`}`,s=>{
    const go=async code=>{const n=$("#obName").value.trim();if(!n)return toast("Önce adını yaz.");if(!code||code.length<6)return toast("Geçerli bir oda kodu gir.");lsSet("bny-name",n);closeSheet();await joinRoom(code,true);if(!fromHash)roomSheet()};
    const nb=s.querySelector("#obNew");if(nb)nb.onclick=()=>go(newCode());
    s.querySelector("#obJoin").onclick=()=>go(fromHash||cleanCode($("#obCode").value));
  },true);
}

async function joinRoom(code,isNew){
  unsubs.forEach(u=>u());unsubs=[];
  room=code;lsSet("bny-room-v2",code);
  if(location.hash.slice(1)!==code)history.replaceState(null,"","#"+code);
  const base=fs.collection("rooms").doc(code);
  db={collection:name=>base.collection(name)};
  shared=true;readOnly=false;
  S.votes={};S.plans=[];S.ideas=[];S.notes=[];members=[];
  try{await base.collection("members").doc(myId).set({name:lsGet("bny-name")||"",ts:Date.now()})}catch(e){denied(e)}
  const err=e=>{console.error(e);if(e&&e.code==="permission-denied")toast("Veriler okunamadı: Firestore kurallarını kontrol et.")};
  unsubs.push(base.collection("members").onSnapshot(s=>{members=s.docs.map(x=>x.id);s.docs.forEach(x=>{people[x.id]={name:x.data().name||"",avatarUrl:""}});render()},err));
  unsubs.push(db.collection("votes").onSnapshot(s=>{const m={};s.docs.forEach(x=>{const v=x.data();if(v&&v.uid&&v.idea&&v.v)m[x.id]=v});S.votes=m;render()},err));
  ["plans","ideas","notes"].forEach(col=>unsubs.push(db.collection(col).onSnapshot(s=>{S[col]=s.docs.map(x=>({id:x.id,...x.data()}));render()},err)));
  render();
}

function roomSheet(){
  if(!shared){toast(FIREBASE_CONFIG?"Henüz bağlanmadı.":"Ortak kullanım için önce Firebase ayarı gerekli.");return}
  const canShare=!!navigator.share;
  sheet(`<h3>Odanız</h3>
  <p class="sub" style="margin:0">Bu linki ya da kodu sevgiline gönder. Açtığında ikiniz aynı listeyi, eşleşmeleri ve planları görürsünüz.</p>
  <div class="code">${esc(room)}</div>
  <div class="banner"><b>Odadakiler:</b> ${members.length?members.map(id=>esc(id===myId?(people[id]?.name||"Sen")+" (sen)":(people[id]?.name||"Sevgilin"))).join(" · "):"yükleniyor..."}</div>
  <div class="field"><label for="rLink">Davet linki</label><input id="rLink" readonly value="${esc(roomLink())}"></div>
  <div class="actions"><button class="btn cherry" id="rCopy">Linki kopyala</button>${canShare?'<button class="btn primary" id="rShare">Paylaş</button>':'<button class="btn line" id="rX">Kapat</button>'}</div>
  <div class="field"><label for="rName">Adın</label><input id="rName" maxlength="24" value="${esc(lsGet("bny-name")||"")}"></div>
  <div class="actions"><button class="btn soft" id="rSave">Adı kaydet</button><button class="btn line" id="rLeave">Odadan çık</button></div>`,s=>{
    s.querySelector("#rCopy").onclick=async()=>{try{await navigator.clipboard.writeText(roomLink());toast("Link kopyalandı.")}catch(e){const i=$("#rLink");i.focus();i.select();toast("Linki seçtim, kopyalayabilirsin.")}};
    const sh=s.querySelector("#rShare");if(sh)sh.onclick=()=>navigator.share({title:"Biz Ne Yapsak?",text:"Date planlarımız için odama gel 💞",url:roomLink()}).catch(()=>{});
    const x=s.querySelector("#rX");if(x)x.onclick=closeSheet;
    s.querySelector("#rSave").onclick=async()=>{const n=$("#rName").value.trim();if(!n)return;lsSet("bny-name",n);try{await db.collection("members").doc(myId).set({name:n,ts:Date.now()})}catch(e){denied(e)}closeSheet();toast("Adın güncellendi.")};
    s.querySelector("#rLeave").onclick=e=>{const b=e.currentTarget;if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Emin misin?";return}
      unsubs.forEach(u=>u());unsubs=[];shared=false;room=null;lsSet("bny-room-v2",null);history.replaceState(null,"",location.pathname);closeSheet();loadLocal();render();onboard()};
  });
}

/* ------------------ BAŞLAT ------------------ */
loadLocal();render();
(async()=>{
  if(!FIREBASE_CONFIG||!window.firebase)return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fs=firebase.firestore();
    const cred=await firebase.auth().signInAnonymously();
    myId=cred.user.uid;
  }catch(e){console.error(e);toast("Firebase'e bağlanılamadı. Anonim girişin açık olduğunu kontrol et.");return}
  const hashCode=cleanCode(location.hash.slice(1)),saved=lsGet("bny-room-v2"),name=lsGet("bny-name");
  if(hashCode&&hashCode!==saved){onboard();return}
  if(saved&&name){joinRoom(saved);return}
  onboard();
})();
window.addEventListener("hashchange",()=>{const c=cleanCode(location.hash.slice(1));if(fs&&c&&c!==room)onboard()});
</script>
</body>
</html>
