<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E2365B">
<meta name="description" content="Sevgililer için ortak date planlayıcı: şehir seç, fikirlere kalp at, eşleşmeleri gör, takvime ekle.">
<meta property="og:title" content="Biz Ne Yapsak?">
<meta property="og:description" content="Birlikte ne yapsak? Date fikirleri, eşleşmeler ve ortak takvim.">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biz Ne Yapsak">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Biz Ne Yapsak?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Caveat:wght@500;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
/* Layout: tek sütun telefon uygulaması, yapışkan başlık + alt sekme çubuğu; kartlar fikir "biletleri" gibi */
:root{
  --bg:#FBF2F5; --surface:#FFFFFF; --sunk:#F4E6EC; --ink:#2B1630; --muted:#7A5F80; --line:#EAD5DE;
  --cherry:#E2365B; --cherry-ink:#FFFFFF; --cherry-soft:#FCDDE4;
  --mint:#21907A; --mint-soft:#D8F2EA; --butter:#F6B93B; --butter-soft:#FDF0D2;
  --plum:#5B3A7A;
  --display:"Caprasimo","Cooper Black",Georgia,serif;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1120; --surface:#251A2C; --sunk:#2F2237; --ink:#F7E8F0; --muted:#B89FBF; --line:#3D2D46;
  --cherry:#FF5C80; --cherry-ink:#2A0B14; --cherry-soft:#4A1E2E;
  --mint:#4FD1B1; --mint-soft:#183A33; --butter:#FFC95C; --butter-soft:#3E3018; --plum:#C9A5EE;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1120; --surface:#251A2C; --sunk:#2F2237; --ink:#F7E8F0; --muted:#B89FBF; --line:#3D2D46;
  --cherry:#FF5C80; --cherry-ink:#2A0B14; --cherry-soft:#4A1E2E;
  --mint:#4FD1B1; --mint-soft:#183A33; --butter:#FFC95C; --butter-soft:#3E3018; --plum:#C9A5EE;
  color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
button.duo{background:none;border:0;padding:0;cursor:pointer}
.hdr-r{display:flex;align-items:center;gap:10px}
.bell{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);position:relative;padding:0}
.bell svg{width:19px;height:19px}
.bell.on{color:var(--cherry);border-color:var(--cherry)}
.bell .bd{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--mint);border:2px solid var(--bg)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600}
.tg small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.tg input{width:22px;height:22px;accent-color:var(--cherry);flex:0 0 auto}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:26px;letter-spacing:.18em;font-weight:800;text-align:center;background:var(--sunk);border-radius:14px;padding:14px;user-select:all}
.or{text-align:center;color:var(--muted);font-size:13px;font-weight:700}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--cherry);outline-offset:2px;border-radius:10px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1;margin:0;letter-spacing:.2px;color:var(--cherry)}
h1 small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.duo{display:flex;align-items:center}
.duo img{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--bg);object-fit:cover;background:var(--sunk)}
.duo img+img{margin-left:-10px}
.duo .heart{margin:0 -4px;z-index:2;color:var(--cherry);font-size:15px;position:relative}
.duo .ghost{width:32px;height:32px;border-radius:50%;border:2px dashed var(--muted);display:grid;place-items:center;color:var(--muted);font-size:16px;margin-left:-6px;background:var(--bg)}

.cities{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none;margin:0 -2px}
.cities::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sm{padding:5px 11px;font-size:13px}

main section{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}

.next{display:flex;gap:14px;align-items:center;background:var(--cherry);color:var(--cherry-ink);border-radius:var(--r);padding:14px 16px}
.next .big{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.next .big small{display:block;font-family:var(--body);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.next b{display:block;font-size:16px}
.next span{font-size:13px;opacity:.88}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.cherry{background:var(--cherry);color:var(--cherry-ink)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13.5px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.count{font-size:13px;color:var(--muted);font-weight:600}

.card{background:var(--surface);border-radius:var(--r);padding:16px 16px 12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;position:relative}
.card.match{border-color:var(--mint);box-shadow:0 0 0 2px var(--mint-soft)}
.card .kicker{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.cat{display:inline-flex;align-items:center;gap:6px}
.cat i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--c)}
.card h3{margin:0;font-size:19px;line-height:1.2;font-weight:800;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;font-weight:600;background:var(--sunk);padding:3px 9px;border-radius:999px;color:var(--ink)}
.tag.time{background:var(--mint-soft);color:var(--mint)}
.tag.nofit{background:transparent;border:1px solid var(--line);color:var(--muted)}
.timebox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tb-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tb-head b{font-size:15px}
.tb-sel{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.tb-sel.off{opacity:.45}
.tb-dash{padding-bottom:12px;color:var(--muted);font-weight:800}
.tag.where{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.perf{border-top:1.5px dashed var(--line);margin:2px -16px 0;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-8px;clip-path:inset(0 0 0 50%)}
.perf::after{right:-8px;clip-path:inset(0 50% 0 0)}
.votes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vote{border:1.5px solid var(--line);background:transparent;border-radius:11px;padding:6px 10px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:5px;min-height:36px}
.vote[aria-pressed="true"][data-v="love"]{background:var(--cherry);border-color:var(--cherry);color:var(--cherry-ink)}
.vote[aria-pressed="true"][data-v="maybe"]{background:var(--butter);border-color:var(--butter);color:#2B1630}
.vote[aria-pressed="true"][data-v="no"]{background:var(--sunk);border-color:var(--muted)}
.votes .sp{flex:1}
.theirs{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.theirs img{width:20px;height:20px;border-radius:50%}
.badge-match{background:var(--mint);color:var(--surface);font-size:11px;padding:3px 8px;border-radius:999px;letter-spacing:.06em}

.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1.5px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:6px 0 0;line-height:1.1}
.sub{color:var(--muted);margin:-6px 0 0;font-size:14px}

.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:64px 1fr;overflow:hidden}
.plan .date{background:var(--cherry-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;text-align:center}
.plan .date .d{font-family:var(--display);font-size:28px;line-height:1;color:var(--cherry);font-variant-numeric:tabular-nums}
.plan .date .m{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--cherry)}
.plan .date .w{font-size:11px;color:var(--muted);margin-top:2px}
.plan.past .date{background:var(--sunk)}
.plan.past .date .d,.plan.past .date .m{color:var(--muted)}
.plan .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.plan h4{margin:0;font-size:16.5px;line-height:1.25}
.plan .info{font-size:13px;color:var(--muted)}
.plan .note{font-size:14px;background:var(--butter-soft);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}
.cal{display:flex;gap:6px;flex-wrap:wrap}
.cal a{font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px}
.stars{display:flex;gap:2px}
.stars button{background:none;border:0;font-size:22px;padding:0 2px;color:var(--line);line-height:1}
.stars button.on{color:var(--butter)}
.memo{font-size:14px;font-style:italic;color:var(--ink);overflow-wrap:anywhere}
.when-pill{font-size:12px;font-weight:800;color:var(--mint);background:var(--mint-soft);padding:2px 8px;border-radius:999px;align-self:flex-start}

.notes{columns:2 160px;column-gap:10px}
.note-card{break-inside:avoid;margin-bottom:10px;border-radius:14px;padding:14px 14px 10px;background:var(--c);color:#2B1630;transform:rotate(var(--rot));position:relative}
.note-card p{margin:0 0 8px;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.note-card .by{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;opacity:.75}
.note-card .x{background:none;border:0;font-size:16px;color:#2B1630;opacity:.6;padding:0 2px}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--sunk);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cherry);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--cherry)}
nav.tabs .dot{position:absolute;top:4px;left:calc(50% + 8px);background:var(--mint);color:var(--surface);font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums}

.sheet-bg{position:fixed;inset:0;background:rgba(20,8,24,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto;animation:up .22s ease-out}
.sheet h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.1}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-top:-6px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

.wheel{background:var(--cherry);color:var(--cherry-ink);border-radius:var(--r);padding:26px 18px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.wheel .t{font-family:var(--display);font-size:26px;line-height:1.15;text-wrap:balance}
.wheel .c{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.wheel.spin .t{animation:flick .09s linear infinite}
@keyframes flick{50%{opacity:.55}}

.banner{font-size:13.5px;background:var(--butter-soft);border-radius:14px;padding:10px 12px;color:var(--ink)}
.banner b{font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 8px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---- fotoğraflar ---- */
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs button{width:56px;height:56px;border-radius:10px;overflow:hidden;border:0;padding:0;background:var(--sunk);position:relative}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .more{display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.ph-in{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.album-card{border-radius:var(--r);overflow:hidden;background:linear-gradient(150deg,#FF6B8A,#B01A48);color:#FFF4F7;padding:22px 20px;display:flex;flex-direction:column;gap:10px;position:relative}
.album-card h2{color:#FFF4F7;font-size:30px;margin:0}
.album-card p{margin:0;opacity:.9}
.album-card .mosaic{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.album-card .mosaic img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:2px solid rgba(255,255,255,.7)}
.album-card .btn{background:#FFF4F7;color:#B01A48;align-self:flex-start}

/* ---- albüm (kitap) ---- */
.alb{position:fixed;inset:0;z-index:70;background:radial-gradient(ellipse at 50% 30%,#3a2232,#140b12 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));touch-action:pan-y}
.alb-top{width:min(100%,460px);display:flex;justify-content:space-between;align-items:center;color:#F5E6EC;font-weight:700;font-size:14px}
.alb-top button,.alb-nav button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#FFF;border-radius:999px;min-width:42px;height:42px;font-size:18px;display:grid;place-items:center;padding:0 12px}
.alb-nav{display:flex;gap:18px;align-items:center;color:#F5E6EC;font-size:13px;font-variant-numeric:tabular-nums}
.book{perspective:1800px;width:min(100%,440px);height:min(74vh,620px);position:relative}
.pg{position:absolute;inset:0;border-radius:6px 16px 16px 6px;background:#FBF4EA;color:#3A2430;box-shadow:0 18px 50px rgba(0,0,0,.45),inset 14px 0 18px -14px rgba(90,50,40,.35);overflow:hidden;display:flex;flex-direction:column;padding:22px 20px 16px;transform-origin:left center;backface-visibility:hidden}
.pg::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(120,80,60,.05) 1px,transparent 1px);background-size:6px 6px}
.pg.out-next{animation:outN .55s ease-in forwards}
.pg.in-next{animation:inN .55s ease-out}
.pg.out-prev{animation:outP .45s ease-in forwards}
.pg.in-prev{animation:inP .55s ease-out;transform-origin:left center}
@keyframes outN{to{transform:rotateY(-105deg);opacity:.2}}
@keyframes inN{from{transform:scale(.97);filter:brightness(.8)}to{transform:none;filter:none}}
@keyframes outP{to{transform:scale(.97);opacity:0}}
@keyframes inP{from{transform:rotateY(-105deg);opacity:.3}to{transform:none;opacity:1}}
.pg-cover{background:linear-gradient(160deg,#E2365B,#8E1240);color:#FFF4F7;justify-content:center;align-items:center;text-align:center;gap:14px}
.pg-cover::before{background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px)}
.pg-cover h1{font-family:var(--display);font-size:42px;line-height:1.05;color:#FFF4F7;margin:0}
.pg-cover .hand{font-family:"Caveat",cursive;font-size:30px}
.pg-cover .stat{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85}
.pg-cover .hearts{font-size:40px;letter-spacing:-8px}
.pg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative}
.pg-date{font-family:var(--display);font-size:34px;line-height:.9;color:#E2365B}
.pg-date small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A6B74;font-weight:800;margin-top:6px}
.pg-stars{color:#F6B93B;font-size:16px;letter-spacing:1px}
.pg h3{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;margin:10px 0 2px;text-wrap:balance;position:relative}
.pg .place{font-size:13px;color:#8A6B74;position:relative}
.pg .quote{font-family:"Caveat",cursive;font-size:24px;line-height:1.15;color:#5B3A4A;margin-top:8px;position:relative;overflow-wrap:anywhere}
.pg-photos{flex:1;min-height:0;position:relative;margin-top:12px}
.pol{position:absolute;background:#fff;padding:7px 7px 24px;box-shadow:0 6px 16px rgba(60,30,30,.22);border:0;cursor:zoom-in}
.pol img{width:100%;height:100%;object-fit:cover;display:block;background:#eee}
.pol::after{content:"";position:absolute;top:-9px;left:50%;width:62px;height:20px;transform:translateX(-50%) rotate(-3deg);background:var(--tape,rgba(246,185,59,.6))}
.pg-foot{display:flex;justify-content:space-between;font-size:11px;color:#A58A92;font-weight:700;letter-spacing:.08em;margin-top:8px;position:relative}
.pg-end{justify-content:center;align-items:center;text-align:center;gap:10px}
.pg-end .hand{font-family:"Caveat",cursive;font-size:34px;color:#5B3A4A}
.lb{position:fixed;inset:0;z-index:80;background:rgba(10,4,8,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:72vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.lb .row{justify-content:center}
.lb .meta{color:#E9D6DE;font-size:13px;text-align:center}
/* ---- tanıtım ---- */
.intro{display:flex;flex-direction:column;gap:14px;min-height:min(560px,78vh)}
.intro .slide{flex:1;display:flex;flex-direction:column;gap:12px;animation:fadeUp .3s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.intro .badge{width:64px;height:64px;border-radius:20px;background:var(--cherry);color:var(--cherry-ink);display:grid;place-items:center}
.intro .badge svg{width:34px;height:34px}
.intro h3{font-size:28px}
.intro p{margin:0;color:var(--muted);font-size:15px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feat div{background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted)}
.feat b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.istep{display:flex;gap:12px;align-items:flex-start;background:var(--sunk);border-radius:14px;padding:12px}
.istep .n{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:14px}
.istep span{font-size:14.5px}
.istep svg{width:18px;height:18px;vertical-align:-3px;color:var(--cherry)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--line);transition:width .2s}
.dots i.on{width:22px;background:var(--cherry)}
.warn{background:var(--butter-soft);border-radius:12px;padding:10px 12px;font-size:13.5px}
@media (prefers-reduced-motion:reduce){.intro .slide{animation:none}}
@media (prefers-reduced-motion:reduce){.pg.out-next,.pg.in-next,.pg.out-prev,.pg.in-prev{animation:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.wheel.spin .t{animation:none}}
@media (max-width:380px){.grid2{grid-template-columns:1fr}.card h3{font-size:18px}}
</style>

function denied(e){
  if(e&&e.code==="permission-denied"){
    try{const u=firebase.auth().currentUser;if(u)u.getIdToken(true)}catch(_){}
    toast(/WhatsApp|Instagram|FBAN|FBAV/i.test(navigator.userAgent)?"Kaydedilemedi. Sayfayı Safari ya da Chrome'da açmayı dene (••• → Tarayıcıda aç).":"Kaydedilemedi: bağlantı izni yok. Sayfayı yenileyip tekrar dene.");return}
  if(e&&e.code==="invalid_argument"){readOnly=true;toast("Bu sayfada değişiklik iznin yok. Sahibinden seni Düzenleyici olarak eklemesini iste.");render()}
  else if(e&&e.code==="quota_exceeded")toast("Depolama doldu, eski notları silmeyi dene.");
  else toast("Kaydedilemedi, birazdan tekrar dene.");
}
async function setVote(idea,v){
  if(readOnly)return toast("Sadece görüntüleme izni var.");
  const key=idea+"~"+myId,cur=S.votes[key];
  const nv=cur&&cur.v===v?null:v;
  if(nv)S.votes[key]={uid:myId,idea,v:nv,ts:Date.now()};else delete S.votes[key];
  render();
  if(shared){try{const r=db.collection("votes").doc(key);nv?await r.set(S.votes[key]):await r.delete()}catch(e){denied(e)}}else saveLocal();
  const it=ideaById(idea),tt=it?it.t:"";
  if(nv==="love"){const pv=partnerVote(idea);if(pv==="love"){toast("Eşleşme! İkiniz de bayıldınız 💞");notify("match",{title:tt})}else queueLove(tt)}
  else unqueueLove(tt);
}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
async function addDoc(col,data){
  if(readOnly)return toast("Sadece görüntüleme izni var.");
  const id=newId();data={...data,by:myId,ts:Date.now()};
  S[col].push({id,...data});render();
  if(shared){try{await db.collection(col).doc(id).set(data)}catch(e){S[col]=S[col].filter(x=>x.id!==id);denied(e)}}else saveLocal();
  return id;
}
async function patchDoc(col,id,patch){
  if(readOnly)return toast("Sadece görüntüleme izni var.");
  const it=S[col].find(x=>x.id===id);if(!it)return;Object.assign(it,patch);render();
  if(shared){try{await db.collection(col).doc(id).update(patch)}catch(e){denied(e)}}else saveLocal();
}
async function delDoc(col,id){
  if(readOnly)return toast("Sadece görüntüleme izni var.");
  S[col]=S[col].filter(x=>x.id!==id);render();
  if(shared){try{await db.collection(col).doc(id).delete()}catch(e){denied(e)}}else saveLocal();
}

function calLinks(p){
  const [h,mi]=(p.time||"19:00").split(":").map(Number);const st=pdate(p.date);st.setHours(h,mi);const en=new Date(st.getTime()+(+p.dur||3)*36e5);
  const f=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"T"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"00";
  const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":00";
  const text="💞 Date: "+p.title,det=(p.note?p.note+"\n\n":"")+"Biz Ne Yapsak? ile planlandı",loc=[p.place,p.city!=="*"?p.city:""].filter(Boolean).join(", ");
  const g="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(text)+"&dates="+f(st)+"/"+f(en)+"&ctz=Europe/Istanbul&details="+encodeURIComponent(det)+"&location="+encodeURIComponent(loc);
  const o="https://outlook.live.com/calendar/0/deeplink/compose?path=/calendar/action/compose&rru=addevent&subject="+encodeURIComponent(text)+"&startdt="+iso(st)+"&enddt="+iso(en)+"&body="+encodeURIComponent(det)+"&location="+encodeURIComponent(loc);
  return {g,o};
}

const MAX_PER_DATE=12;
function plansPhotos(pid){return S.photos.filter(x=>x.plan===pid).sort((a,b)=>a.ts-b.ts)}
function photoThumbs(pid){
  const ph=plansPhotos(pid);if(!ph.length)return "";
  const show=ph.slice(0,5),more=ph.length-show.length;

}
async function loadBitmap(file){
  try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){}
  return await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{res(im)};im.onerror=()=>rej(new Error("Görsel açılamadı"));im.src=u});
}
function toJpeg(src,max,q,limit){
  const w=src.width,h=src.height,k=Math.min(1,max/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);
  let d=c.toDataURL("image/jpeg",q);
  while(limit&&d.length>limit&&q>0.4){q-=0.1;d=c.toDataURL("image/jpeg",q)}
  return {data:d,w:c.width,h:c.height};
}
async function addPhotos(pid,files){
  if(!shared||!fs)return toast("Fotoğraf eklemek için odaya bağlı olmalısın.");
  const have=plansPhotos(pid).length;files=[...files].filter(f=>/^image\//.test(f.type)||/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
  if(!files.length)return;
  if(have+files.length>MAX_PER_DATE){toast(`Her date için en fazla ${MAX_PER_DATE} fotoğraf. İlk ${Math.max(0,MAX_PER_DATE-have)} tanesi eklenecek.`);files=files.slice(0,Math.max(0,MAX_PER_DATE-have))}
  let ok=0;
  for(let i=0;i<files.length;i++){
    toast(`Fotoğraf yükleniyor ${i+1}/${files.length}…`);
    try{
      const bmp=await loadBitmap(files[i]);
      const th=toJpeg(bmp,640,0.72,120000),full=toJpeg(bmp,1600,0.82,700000);
      const id=newId(),ts=Date.now();
      await fs.collection("rooms").doc(room).collection("photoFull").doc(id).set({data:full.data,plan:pid});
      await db.collection("photos").doc(id).set({plan:pid,thumb:th.data,w:full.w,h:full.h,by:myId,ts});
      ok++;
    }catch(e){console.error(e);toast("Bir fotoğraf yüklenemedi"+(e&&e.code==="permission-denied"?": izin yok.":"."))}
  }
  if(ok)toast(ok===1?"Fotoğraf albüme eklendi 📸":`${ok} fotoğraf albüme eklendi 📸`);
}
document.addEventListener("change",e=>{const t=e.target;if(t&&t.dataset&&t.dataset.photo){const f=t.files;addPhotos(t.dataset.photo,f).finally(()=>{try{t.value=""}catch(_){}})}});

let albumOpen=false,albPages=[],albIdx=0,albBusy=false;
function openAlbum(start){
  albPages=buildPages();albIdx=Math.min(start||0,albPages.length-1);albumOpen=true;
  let root=$("#albRoot");if(!root){root=document.createElement("div");root.id="albRoot";document.body.appendChild(root)}
  root.innerHTML=`<div class="alb" role="dialog" aria-modal="true" aria-label="Albüm"><div class="alb-top"><span id="albCount"></span><button id="albX" aria-label="Kapat">✕</button></div><div class="book" id="book"></div><div class="alb-nav"><button id="albP" aria-label="Önceki sayfa">‹</button><span>kaydır ya da dokun</span><button id="albN" aria-label="Sonraki sayfa">›</button></div></div>`;
  root.querySelector("#albX").onclick=closeAlbum;
  root.querySelector("#albP").onclick=()=>flip(-1);
  root.querySelector("#albN").onclick=()=>flip(1);
  const bk=root.querySelector("#book");let sx=null,sy=0;
  bk.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  bk.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))flip(dx<0?1:-1)});
  drawPage(0);document.documentElement.style.overflow="hidden";
}
function closeAlbum(){albumOpen=false;const r=$("#albRoot");if(r)r.innerHTML="";document.documentElement.style.overflow=""}
function drawPage(dir){
  if(!albumOpen)return;albPages=buildPages();albIdx=Math.max(0,Math.min(albIdx,albPages.length-1));
  const bk=$("#book");if(!bk)return;
  const html=pageHTML(albPages[albIdx],albIdx,albPages.length);
  const old=bk.querySelector(".pg");
  const tmp=document.createElement("div");tmp.innerHTML=html;const nw=tmp.firstElementChild;
  if(old&&dir){
    if(dir>0){bk.insertBefore(nw,old);nw.classList.add("in-next");old.classList.add("out-next")}
    else{bk.appendChild(nw);nw.classList.add("in-prev");old.classList.add("out-prev")}
    albBusy=true;setTimeout(()=>{old.remove();nw.className=nw.className.replace(/ ?(in|out)-(next|prev)/g,"");albBusy=false},560);
  }else{bk.innerHTML="";bk.appendChild(nw)}
  $("#albCount").textContent=albIdx===0?"Kapak":albIdx===albPages.length-1?"Son sayfa":`Sayfa ${albIdx} / ${albPages.length-2}`;
  $("#albP").disabled=albIdx===0;$("#albN").disabled=albIdx===albPages.length-1;
}
function flip(d){if(albBusy)return;const n=albIdx+d;if(n<0||n>=albPages.length)return;albIdx=n;drawPage(d)}
document.addEventListener("keydown",e=>{if(!albumOpen)return;if(e.key==="ArrowRight")flip(1);else if(e.key==="ArrowLeft")flip(-1);else if(e.key==="Escape")closeAlbum()});

function b64u(s){const p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))}

  }else if(Notification.permission==="denied"){
    body=`<p class="sub" style="margin:0">Bildirim izni bu cihazda engellenmiş. Telefonun <b>Ayarlar → Bildirimler</b> bölümünden ${isIOS?"<b>Biz Ne Yapsak</b>":"tarayıcın"} için izin verip sayfayı yenile.</p>`;
  }else if(!pushOn){
    body=`<p class="sub" style="margin:0">Sevgilin bir fikre bayılınca, date planlayınca ve date yaklaşınca telefonuna haber gelsin.</p>
    <button class="btn cherry" id="nOn">Bildirimleri aç</button>`;
  }else{
    const pr=getPrefs();
    body=`<p class="sub" style="margin:0">Bu cihazda bildirimler açık. Neler için haber almak istediğini seç:</p>
    <div>${PREF_KEYS.map(([k,n,sm])=>`<label class="tg"><span>${n}${sm?`<small>${sm}</small>`:""}</span><input type="checkbox" data-pref="${k}" ${pr[k]?"checked":""}></label>`).join("")}</div>
    <div class="actions"><button class="btn soft" id="nTest">Test bildirimi</button><button class="btn line" id="nOff">Bu cihazda kapat</button></div>`;
  }
  sheet(`<h3>Bildirimler</h3>${body}<button class="btn line sm" id="nX">Kapat</button>`,s=>{
    s.querySelector("#nX").onclick=closeSheet;
    const on=s.querySelector("#nOn");if(on)on.onclick=enablePush;
    const off=s.querySelector("#nOff");if(off)off.onclick=disablePush;
    const ts=s.querySelector("#nTest");if(ts)ts.onclick=()=>{notify("test",{},true);toast("Test bildirimi gönderildi.")};
    s.querySelectorAll("[data-pref]").forEach(c=>c.onchange=async()=>{const pr=getPrefs();pr[c.dataset.pref]=c.checked;lsSet("bny-prefs",JSON.stringify(pr));try{await pushRef().set({prefs:pr},{merge:true})}catch(e){denied(e)}});
  });
}

/* ------------------ TANITIM REHBERİ ------------------ */
const INTRO_KEY="bny-intro-v1";
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e});
const isAndroid=/Android/i.test(navigator.userAgent);
const inApp=/WhatsApp|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent);
const ICO={
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.6 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M11 18h2"/></svg>',
  key:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M15 8l2 2"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>'
};
function installSlide(){
  if(isStandalone)return null;
  let steps="";
  if(inApp){
    return `<div class="badge">${ICO.phone}</div><h3>Önce tarayıcıda aç</h3>
    <p>Şu an WhatsApp ya da Instagram'ın içindeki tarayıcıdasın. Burada kayıt ve bildirimler düzgün çalışmayabilir.</p>
    <div class="istep"><span class="n">1</span><span>Sağ üstteki ya da alttaki ${ICO.dots} menüsüne dokun.</span></div>
    <div class="istep"><span class="n">2</span><span><b>${isIOS?"Safari'de Aç":"Tarayıcıda aç"}</b>'ı seç.</span></div>
    <div class="istep"><span class="n">3</span><span>Açılan sayfada bu rehber tekrar çıkar, ana ekrana eklemeyi orada anlatıyorum.</span></div>`;
  }
  if(isIOS){
    steps=`<div class="istep"><span class="n">1</span><span>Safari'de alttaki <b>Paylaş</b> ${ICO.share} düğmesine dokun.</span></div>
    <div class="istep"><span class="n">2</span><span>Listeyi biraz aşağı kaydırıp <b>Ana Ekrana Ekle</b> ${ICO.plus}'yi seç, sonra <b>Ekle</b> de.</span></div>
    <div class="istep"><span class="n">3</span><span>Ana ekranda çıkan <b>Biz Ne Yapsak</b> simgesinden aç. Bildirimler sadece böyle açılınca çalışır.</span></div>
    <div class="warn">Ana ekrandan ilk açtığında adını yazıp aynı oda koduyla bir kez daha katılman gerekecek. Hiçbir şey kaybolmaz.</div>`;
  }else if(isAndroid){
    steps=installEvt?`<button class="btn cherry" id="doInstall">📲 Ana ekrana yükle</button>
    <p>Tek dokunuşla telefonuna uygulama gibi yüklenir.</p>`
    :`<div class="istep"><span class="n">1</span><span>Chrome'da sağ üstteki ${ICO.dots} menüsüne dokun.</span></div>
    <div class="istep"><span class="n">2</span><span><b>Ana ekrana ekle</b> ya da <b>Uygulamayı yükle</b>'yi seç.</span></div>
    <div class="istep"><span class="n">3</span><span>Ana ekrandaki simgeden aç, uygulama gibi tam ekran çalışır.</span></div>`;
  }else{
    steps=installEvt?`<button class="btn cherry" id="doInstall">💻 Bilgisayara yükle</button>`:
    `<p>En güzel deneyim telefonda. Bu sayfayı telefonunda açıp ana ekrana eklemeni öneririm. Bilgisayarda da sorunsuz çalışır.</p>`;
  }
  return `<div class="badge">${ICO.phone}</div><h3>Ana ekrana ekle</h3>
  <p>Böylece uygulama gibi tek dokunuşla açılır, tam ekran çalışır ve telefonuna bildirim gelebilir.</p>${steps}`;
}
function introSlides(){
  const sl=[
    `<div class="badge">${ICO.heart}</div><h3>Hoş geldiniz 💞</h3>
     <p><b style="color:var(--ink)">Biz Ne Yapsak?</b> "bugün ne yapsak" diye tıkandığınızda ikinizin birlikte karar vermesi için yapıldı.</p>
     <p>Şehrinizi seçin, fikirlere kalp atın. İkinizin de kalp attığı fikirler eşleşir, takvime koyar, yaptıktan sonra fotoğraflarla albüme eklersiniz.</p>`,
    `<div class="badge">${ICO.star}</div><h3>Neler var?</h3>
     <div class="feat">
      <div><b>🧭 Keşfet</b>8 şehirde 120'den fazla date fikri; kategori, bütçe ve saat filtresi</div>
      <div><b>💞 Eşleşme</b>İkinizin de bayıldığı fikirler burada toplanır</div>
      <div><b>🎲 Şansımıza bırak</b>Kararsız kalınca çark sizin yerinize seçer</div>
      <div><b>📅 Planlar</b>Tarih ve saat seçin, Google veya Outlook takvimine ekleyin</div>
      <div><b>📖 Albüm</b>Yapılan date'lere fotoğraf ve anı ekleyin, sayfa sayfa gezin</div>
      <div><b>🔔 Bildirimler</b>Kalp, eşleşme, yeni plan ve yaklaşan date için haber</div>
     </div>`,
    installSlide(),
    `<div class="badge">${ICO.key}</div><h3>Nasıl başlarız?</h3>
     <div class="istep"><span class="n">1</span><span>Biriniz adını yazıp <b>Yeni oda kur</b> desin.</span></div>
     <div class="istep"><span class="n">2</span><span>Sağ üstteki kalp simgesinden <b>davet linkini</b> kopyalayıp sevgiline gönder.</span></div>
     <div class="istep"><span class="n">3</span><span>O linki açıp adını yazınca aynı odadasınız. Artık her şey ikinizde anında görünür.</span></div>
     <div class="istep"><span class="n">4</span><span>Sağ üstteki 🔔 ile bildirimleri açmayı unutmayın.</span></div>`
  ];
  return sl.filter(Boolean);
}
function showIntro(done){
  const sl=introSlides();let i=0;
  const draw=()=>{
    const last=i===sl.length-1;
    sheet(`<div class="intro"><div class="slide">${sl[i]}</div>
      <div class="dots">${sl.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
      <div class="actions"><button class="btn line" id="inSkip">${i===0?"Geç":"Geri"}</button><button class="btn cherry" id="inNext">${last?"Başlayalım 💞":"İleri"}</button></div></div>`,s=>{
      const fin=()=>{lsSet(INTRO_KEY,"1");closeSheet();done&&done()};
      s.querySelector("#inNext").onclick=()=>{if(last)fin();else{i++;draw()}};
      s.querySelector("#inSkip").onclick=()=>{if(i===0)fin();else{i--;draw()}};
      const ins=s.querySelector("#doInstall");
      if(ins)ins.onclick=async()=>{try{installEvt.prompt();const r=await installEvt.userChoice;installEvt=null;if(r&&r.outcome==="accepted")toast("Yüklendi! Ana ekrandaki simgeden açabilirsin.");draw()}catch(e){}};
      let sx=null;const el=s.querySelector(".intro");
      el.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
      el.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(dx<-50&&!last){i++;draw()}else if(dx>50&&i>0){i--;draw()}});
    },true);
  };
  draw();
}

/* ------------------ BAŞLAT ------------------ */
loadLocal();render();
(async()=>{
  if(!FIREBASE_CONFIG||!window.firebase)return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth();
    // Uygulama içi tarayıcılarda (WhatsApp, Instagram) kalıcı depolama bozuk olabiliyor: yedek olarak bellekte tut
    try{await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)}catch(e){try{await auth.setPersistence(firebase.auth.Auth.Persistence.NONE)}catch(_){}}
    fs=firebase.firestore();
    try{fs.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
    const u=auth.currentUser||(await auth.signInAnonymously()).user;
    await u.getIdToken(true); // Firestore'a gitmeden önce oturum belgesinin hazır olduğundan emin ol
    myId=u.uid;
  }catch(e){console.error(e);toast("Firebase'e bağlanılamadı. Anonim girişin açık olduğunu kontrol et.");return}
  const go=()=>{
    const hashCode=cleanCode(location.hash.slice(1)),saved=lsGet("bny-room-v2"),name=lsGet("bny-name");
    if(hashCode&&hashCode!==saved){onboard();return}
    if(saved&&name){joinRoom(saved);return}
    onboard();
  };
  if(!lsGet(INTRO_KEY))showIntro(go);else go();
})();
window.addEventListener("hashchange",()=>{const c=cleanCode(location.hash.slice(1));if(fs&&c&&c!==room)onboard()});
</script>
